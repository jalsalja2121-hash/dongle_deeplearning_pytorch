# Vision Transformer B/16 Model Configuration

model:
  name: vit_b16
  type: MyVit_b_16
  params:
    num_classes: 3
    feature_extractor: false  # false: fine-tuning, true: feature extraction
    pretrained: true

# Training hyperparameters
training:
  epochs: 300
  batch_size: 32
  learning_rate: 1e-3

  # Optimizer
  optimizer:
    type: adam  # adam, adamw, sgd
    weight_decay: 0.1
    momentum: 0.9  # only for SGD

  # Learning Rate Scheduler
  scheduler:
    use: true
    type: cosine  # step, cosine, reduce
    step_size: 300
    gamma: 0.1

  # Loss Function
  loss:
    type: crossentropy  # crossentropy, focal, label_smoothing
    label_smoothing: 0.0

# Data settings
data:
  image_size: [224, 224]
  num_workers: 0
