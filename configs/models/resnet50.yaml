# ResNet50 Model Configuration

model:
  name: resnet50
  type: MyResNet50
  params:
    num_classes: 3
    feature_extractor: false
    pretrained: true

# Training hyperparameters
training:
  epochs: 50
  batch_size: 32
  learning_rate: 1e-4

  # Optimizer
  optimizer:
    type: adamw
    weight_decay: 0.01
    momentum: 0.9

  # Learning Rate Scheduler
  scheduler:
    use: true
    type: cosine
    step_size: 50
    gamma: 0.1

  # Loss Function
  loss:
    type: crossentropy
    label_smoothing: 0.1

# Data settings
data:
  image_size: [224, 224]
  num_workers: 0
