# AlexNet Quick Training Experiment

experiment:
  name: 'alexnet_rps_quick'
  description: 'Quick AlexNet training for testing (10 epochs)'
  seed: 42

# Dataset
dataset_config: 'configs/datasets/rps_dataset1.yaml'

# Model
model_config: 'configs/models/alexnet_feature_extractor.yaml'

# Training
training:
  epochs: 10
  learning_rate: 0.001  # 1e-3

  optimizer:
    type: 'adam'
    weight_decay: 0.0001  # AlexNet 논문: 0.0005, 조정 가능
    momentum: 0.9

  scheduler:
    use: true
    type: 'step'  # AlexNet 논문: StepLR
    step_size: 3  # 3 에포크마다 감소
    gamma: 0.1

  loss:
    type: 'crossentropy'
    label_smoothing: 0.0

# Output
output:
  save_dir: 'outputs/alexnet_rps_quick'
  model_name: 'model.pth'
  plot_name: 'training_history.png'
