# Full training experiment with ViT (논문 기반)

experiment:
  name: 'vit_rps_full'
  description: 'Full ViT training with paper hyperparameters'
  seed: 42

# Dataset
dataset_config: 'configs/datasets/rps_dataset1.yaml'

# Model
model_config: 'configs/models/vit_feature_extractor.yaml'

# Training (ViT paper based)
training:
  epochs: 300
  learning_rate: 0.001

  optimizer:
    type: 'adam'
    weight_decay: 0.1
    momentum: 0.9

  scheduler:
    use: true
    type: 'cosine'
    step_size: 300
    gamma: 0.1

  loss:
    type: 'crossentropy'
    label_smoothing: 0.0

# Output
output:
  save_dir: 'outputs/vit_rps_full'
  model_name: 'model.pth'
  plot_name: 'training_history.png'
