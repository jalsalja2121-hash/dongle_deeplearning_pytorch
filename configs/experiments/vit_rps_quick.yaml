# Quick training experiment with ViT

experiment:
  name: 'vit_rps_quick'
  description: 'Quick ViT training for testing'
  seed: 42

# Dataset
dataset_config: 'configs/datasets/rps_dataset1.yaml'

# Model
model_config: 'configs/models/vit_feature_extractor.yaml'

# Training
training:
  epochs: 10
  learning_rate: 0.001

  optimizer:
    type: 'adam'
    weight_decay: 0.1
    momentum: 0.9

  scheduler:
    use: true
    type: 'cosine'
    step_size: 10
    gamma: 0.1

  loss:
    type: 'crossentropy'
    label_smoothing: 0.0

# Output
output:
  save_dir: 'outputs/vit_rps_quick'
  model_name: 'model.pth'
  plot_name: 'training_history.png'
