dataset:
  batch_size: 32
  data_root: data/Chest_Xray
  description: Chest X-ray Dataset - Binary Classification (NORMAL vs PNEUMONIA)
  image_size:
  - 224
  - 224
  num_workers: 4
  type: rps
dataset_config: configs/datasets/xray_dataset1.yaml
experiment:
  description: ResNet50 for Chest X-ray Pneumonia Detection
  name: resnet50_xray_pneumonia
  seed: 42
model:
  description: ResNet50 Feature Extractor for binary classification (X-ray)
  feature_extractor: true
  num_classes: 2
  pretrained: true
  type: resnet50
model_config: configs/models/resnet50_xray.yaml
output:
  model_name: model.pth
  plot_name: training_history.png
  save_dir: outputs/resnet50_xray_pneumonia
training:
  early_stopping:
    min_delta: 0.0001
    monitor: val_loss
    patience: 5
  epochs: 50
  learning_rate: 0.0001
  loss:
    type: crossentropy
  optimizer:
    type: adam
    weight_decay: 0.0001
  scheduler:
    step_size: 50
    type: cosine
    use: true
